name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: feedback-test
          POSTGRES_DB: feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d feedback_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: npm ci --omit=dev
        working-directory: spec-board
      - run: node spec-board/roadmap-test.js
      - run: node spec-board/roadmap-service-test.js
      - run: node spec-board/roadmap-db-test.js
        env:
          ROADMAP_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/test.js
      - run: node spec-board/feedback-github-test.js
      - run: node spec-board/feedback-test.js
      - run: node spec-board/feedback-service-test.js
      - run: node spec-board/feedback-db-test.js
        env:
          FEEDBACK_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: shellcheck editor/*.sh hack/*.sh

  # The two files an image build needs must agree, and the rebrand overlay must
  # still find every string it rewrites: sed exits 0 on no match, so upstream
  # moving a template would otherwise ship a silently unbranded image.
  editor-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # `git bundle verify` cannot run here: this repo holds none of upstream's
      # history, so the bundle's base commit is unknown to it.
      - run: hack/checkout-critic.sh "$RUNNER_TEMP/critic"
      - run: hack/sync-critic.sh --check "$RUNNER_TEMP/critic"
      - name: install editor dependencies
        working-directory: ${{ runner.temp }}/critic
        run: corepack yarn install --immutable
      - name: editor regression tests and lint
        working-directory: ${{ runner.temp }}/critic
        run: |
          corepack yarn exec mocha test/critic-markup.js test/critic-contexts.js test/critic-footnotes.js test/critic-review-ui.js test/critic-margin.js test/critic-suggestion.js
          corepack yarn eslint
          corepack yarn mocha-suite
      - name: run the overlay against the fork tree
        run: |
          cp editor/overlay.sh "$RUNNER_TEMP/critic/"
          cp -r editor/branding "$RUNNER_TEMP/critic/"
          cd "$RUNNER_TEMP/critic" && bash overlay.sh
      - name: attribution survived the rebrand
        run: grep -q 'hedgedoc\.org">HedgeDoc</a>' "$RUNNER_TEMP/critic/public/views/index/body.ejs"
      - name: build the editor
        working-directory: ${{ runner.temp }}/critic
        run: corepack yarn build
