name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: feedback-test
          POSTGRES_DB: feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d feedback_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: npm ci --omit=dev
        working-directory: spec-board
      - run: npm audit --omit=dev --audit-level=high
        working-directory: spec-board
      - name: build board image
        run: docker build --tag specdoc-board:test ./spec-board
      - run: node spec-board/roadmap-test.js
      - run: node spec-board/roadmap-service-test.js
      - run: node spec-board/roadmap-db-test.js
        env:
          ROADMAP_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/test.js
      - run: node --test spec-board/spec-relations-test.js
      - run: node spec-board/reviewer-identities-test.js
      - run: node spec-board/github-oauth-test.js
      - run: node spec-board/frontmatter-repair-test.js
      - run: node spec-board/notifications-test.js
      - run: node spec-board/notification-security-test.js
      - run: node --test spec-board/generated-findings-test.js spec-board/finding-integration-test.js spec-board/review-delivery-test.js
      - run: node spec-board/review-service-test.js
      - run: node spec-board/review-http-test.js
      - run: node spec-board/review-publication-test.js
      - run: node spec-board/revision-summary-test.js
      - run: node spec-board/summary-baseline-test.js
      - run: node spec-board/review-reminders-test.js
      - run: node spec-board/review-store-db-test.js
        env:
          REVIEW_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/review-delivery-store-db-test.js
        env:
          REVIEW_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/review-reminders-db-test.js
        env:
          REVIEW_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/review-server-db-test.js
        env:
          REVIEW_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node --test spec-board/review-policy-test.js
      - run: node spec-board/privacy-test.js
      - run: node spec-board/deployment-test.js
      - run: node spec-board/config-test.js
      - run: node spec-board/health-state-test.js
      - run: node spec-board/lifecycle-test.js
      - run: node spec-board/publication-recovery-test.js
      - run: node spec-board/implementation-scan-test.js
      - run: node --test spec-board/security-boundaries-test.js
      - run: node --test spec-board/model-output-test.js
      - run: node spec-board/security-model-test.js
      - run: node spec-board/model-credentials-test.js
      - run: node spec-board/publication-security-test.js
      - run: node spec-board/publication-remote-test.js
      - run: node --test spec-board/publication-auto-merge-test.js
      - run: node --test spec-board/pr-intake-test.js spec-board/pr-intake-auth-test.js spec-board/pr-intake-server-test.js
      - run: node spec-board/docs-followup-config-test.js
      - run: node --test spec-board/docs-followup-auth-test.js spec-board/docs-followup-server-test.js
      - run: node spec-board/docs-followup-service-test.js
      - run: node --test spec-board/docs-followup-test.js spec-board/docs-followup-github-test.js
      - run: node spec-board/docs-followup-store-db-test.js
        env:
          DOCS_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node --test spec-board/publication-replacement-test.js
      - run: node spec-board/notifications-db-test.js
        env:
          NOTIFICATIONS_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/snapshots-db-test.js
        env:
          SNAPSHOTS_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/notification-delivery-db-test.js
        env:
          NOTIFICATIONS_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/audit-db-test.js
        env:
          AUDIT_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/database-admin-db-test.js
        env:
          AUDIT_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/history-redaction-db-test.js
        env:
          AUDIT_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/security-budgets-db-test.js
        env:
          AUDIT_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/moderation-db-test.js
        env:
          AUDIT_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/publication-security-db-test.js
        env:
          AUDIT_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/publication-replacement-db-test.js
        env:
          AUDIT_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/bot-api-db-test.js
        env:
          AUDIT_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/public-operations-db-test.js
        env:
          AUDIT_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/publication-state-db-test.js
        env:
          AUDIT_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test
      - run: node spec-board/feedback-github-test.js
      - run: node spec-board/feedback-test.js
      - run: node spec-board/feedback-service-test.js
      - run: node spec-board/feedback-db-test.js
        env:
          FEEDBACK_TEST_DATABASE_URL: postgresql://postgres:feedback-test@127.0.0.1:5432/feedback_test

  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: cli
      - run: npm audit --omit=dev --audit-level=high
        working-directory: cli
      - run: npm test
        working-directory: cli
      - run: npm run test:package
        working-directory: cli

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - run: npm ci
        working-directory: mcp
      - run: npm audit --omit=dev --audit-level=high
        working-directory: mcp
      - run: npm test
        working-directory: mcp

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: shellcheck editor/*.sh hack/*.sh
      - run: bash hack/test-build-editor-cache.sh

  # The two files an image build needs must agree, and the rebrand overlay must
  # still find every string it rewrites: sed exits 0 on no match, so upstream
  # moving a template would otherwise ship a silently unbranded image.
  editor-inputs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: cli-test
          POSTGRES_DB: cli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cli_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - name: rebase manifest and lock selection regressions
        run: node --test editor/rebase-manifest-test.cjs
      # `git bundle verify` cannot run here: this repo holds none of upstream's
      # history, so the bundle's base commit is unknown to it.
      - run: hack/checkout-critic.sh "$RUNNER_TEMP/critic"
      - run: hack/sync-critic.sh --check "$RUNNER_TEMP/critic"
      - name: install editor dependencies
        working-directory: ${{ runner.temp }}/critic
        run: corepack yarn install --immutable
      - name: verify dependency audit gate
        run: node --test hack/check-editor-audit-test.cjs
      - name: audit all editor dependencies
        working-directory: ${{ runner.temp }}/critic
        run: node "$GITHUB_WORKSPACE/hack/check-editor-audit.cjs"
      - name: editor regression tests and lint
        working-directory: ${{ runner.temp }}/critic
        run: |
          corepack yarn exec mocha test/critic-markup.js test/critic-contexts.js test/critic-footnotes.js test/critic-review-ui.js test/critic-margin.js test/critic-suggestion.js test/frontmatter-repair.js
          corepack yarn eslint
          corepack yarn mocha-suite
      - name: editor cross-process receipt and device-token races
        working-directory: ${{ runner.temp }}/critic
        run: corepack yarn test:cli-postgres
        env:
          SPECDOC_TEST_POSTGRES_URL: postgresql://postgres:cli-test@127.0.0.1:5432/cli_test
      - name: editor PostgreSQL migration upgrade
        working-directory: ${{ runner.temp }}/critic
        run: corepack yarn test:upgrade-postgres
        env:
          SPECDOC_TEST_POSTGRES_URL: postgresql://postgres:cli-test@127.0.0.1:5432/cli_test
      - run: npm ci --omit=optional
        working-directory: cli
      - name: actual CLI and editor integration
        run: node hack/test-cli-editor.cjs
        env:
          SPECDOC_TEST_EDITOR_DIR: ${{ runner.temp }}/critic
      - name: run the overlay against the fork tree
        run: |
          cp editor/overlay.sh "$RUNNER_TEMP/critic/"
          cp -r editor/branding "$RUNNER_TEMP/critic/"
          cd "$RUNNER_TEMP/critic" && bash overlay.sh
      - name: attribution survived the rebrand
        run: grep -q 'hedgedoc\.org">HedgeDoc</a>' "$RUNNER_TEMP/critic/public/views/index/body.ejs"
      - name: build the editor
        working-directory: ${{ runner.temp }}/critic
        run: corepack yarn build
